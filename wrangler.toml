"$schema" = "./node_modules/wrangler/config-schema.json"
name = "cfgate-service-worker"
main = "./src/index.ts"
compatibility_date = "2026-02-18"
compatibility_flags = ["nodejs_compat"]
workers_dev = false

[assets]
directory = "./dist"
binding = "ASSETS"
run_worker_first = true

[[routes]]
pattern = "cfgate.io"
custom_domain = true

[observability]
enabled = true
head_sampling_rate = 0.05

[version_metadata]
binding = "CF_VERSION_METADATA"

[vars]
ENVIRONMENT = "production"

[triggers]
crons = ["17 * * * *"]

[[durable_objects.bindings]]
name = "PROJECT_COORDINATOR"
class_name = "ProjectCoordinator"

[[migrations]]
tag = "v1-project-coordinator"
new_sqlite_classes = ["ProjectCoordinator"]

[previews]
[previews.vars]
ENVIRONMENT = "staging"

[previews.durable_objects]
bindings = []
