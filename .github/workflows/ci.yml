name: CI

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'docs/**'
      - 'scripts/**'
      - 'public/**'
      - 'tests/**'
      - 'astro.config.ts'
      - 'tsconfig*.json'
      - 'vitest*.config.ts'
      - 'eslint.config.ts'
      - 'wrangler.toml'
      - 'pnpm-workspace.yaml'
      - '.node-version'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'src/**'
      - 'docs/**'
      - 'scripts/**'
      - 'public/**'
      - 'tests/**'
      - 'astro.config.ts'
      - 'tsconfig*.json'
      - 'vitest*.config.ts'
      - 'eslint.config.ts'
      - 'wrangler.toml'
      - 'pnpm-workspace.yaml'
      - '.node-version'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: pnpm/action-setup@v6.1.0

      - uses: actions/setup-node@v7.0.0
        with:
          node-version-file: '.node-version'
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      - run: pnpm lint

      - run: pnpm typecheck

      - run: pnpm build
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - run: pnpm test
